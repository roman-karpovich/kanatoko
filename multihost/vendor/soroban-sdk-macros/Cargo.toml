[package]
edition = "2021"
rust-version = "1.91.0"
name = "kanatoko-sdk29-macros"
version = "29.0.1"
authors = ["Stellar Development Foundation <info@stellar.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Kanatoko compatibility build for Host 29.0.2. Soroban SDK macros."
homepage = "https://github.com/roman-karpovich/kanatoko"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/roman-karpovich/kanatoko"

[features]
testutils = []

[lib]
name = "soroban_sdk_macros"
path = "src/lib.rs"
doctest = false
proc-macro = true

[dependencies.darling]
version = "0.20.10"

[dependencies.heck]
version = "0.5.0"

[dependencies.itertools]
version = "0.13.0"

[dependencies.macro-string]
version = "0.1.4"

[dependencies.proc-macro2]
version = "1.0"

[dependencies.quote]
version = "1.0"

[dependencies.sha2]
version = "0.10.7"

[dependencies.soroban-env-common]
version = "=29.0.2"

[dependencies.soroban-spec]
version = "29.0.1"

[dependencies.soroban-spec-rust]
version = "29.0.1"

[dependencies.stellar-xdr]
version = "=28.0.0"
features = ["std"]
default-features = false

[dependencies.syn]
version = "2.0.77"
features = ["full"]
