[package]
edition = "2021"
rust-version = "1.91.0"
name = "kanatoko-sdk29"
version = "29.0.1"
authors = ["Stellar Development Foundation <info@stellar.org>"]
build = "build.rs"
exclude = [
    "test_snapshots/",
    "src/tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Kanatoko compatibility build for Host 29.0.2. Soroban SDK."
homepage = "https://github.com/roman-karpovich/kanatoko"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/roman-karpovich/kanatoko"

[package.metadata.docs.rs]
all-features = true

[features]
alloc = []
docs = []
hazmat = [
    "hazmat-crypto",
    "hazmat-address",
]
hazmat-address = []
hazmat-crypto = []
testutils = [
    "soroban-sdk-macros/testutils",
    "soroban-env-host/testutils",
    "soroban-ledger-snapshot/testutils",
    "dep:ed25519-dalek",
    "dep:arbitrary",
    "dep:derive_arbitrary",
    "dep:ctor",
    "dep:soroban-ledger-snapshot",
]

[lib]
name = "soroban_sdk"
path = "src/lib.rs"
doctest = false

[dependencies.bytes-lit]
version = "0.0.6"

[dependencies.soroban-sdk-macros]
package = "kanatoko-sdk29-macros"
version = "=29.0.1"
path = "../soroban-sdk-macros"

[dependencies.stellar-strkey]
version = "=0.0.16"

[dependencies.visibility]
version = "0.1.1"

[build-dependencies.crate-git-revision]
version = "0.0.9"

[build-dependencies.rustc_version]
version = "0.4.1"

[target.'cfg(not(target_family="wasm"))'.dependencies.arbitrary]
version = "~1.3.0"
features = ["derive"]
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.ctor]
version = "0.5.0"
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.curve25519-dalek]
version = "4.1.3"
features = ["digest"]
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.derive_arbitrary]
version = "~1.3.0"
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.ed25519-dalek]
version = "2.1.1"
features = ["rand_core"]
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.rand]
version = "0.8.5"

[target.'cfg(not(target_family="wasm"))'.dependencies.serde]
version = "1.0.0"
features = ["derive"]

[target.'cfg(not(target_family="wasm"))'.dependencies.serde_json]
version = "1.0.0"

[target.'cfg(not(target_family="wasm"))'.dependencies.soroban-env-host]
version = "=29.0.2"
features = []

[target.'cfg(not(target_family="wasm"))'.dependencies.soroban-ledger-snapshot]
package = "kanatoko-ledger-snapshot29"
version = "=29.0.1"
path = "../soroban-ledger-snapshot"
optional = true

[target.'cfg(not(target_family="wasm"))'.dependencies.stellar-strkey]
version = "=0.0.16"

[target.'cfg(target_family="wasm")'.dependencies.soroban-env-guest]
version = "=29.0.2"
