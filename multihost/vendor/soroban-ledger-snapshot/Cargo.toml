[package]
edition = "2021"
rust-version = "1.91.0"
name = "kanatoko-ledger-snapshot29"
version = "29.0.1"
authors = ["Stellar Development Foundation <info@stellar.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Kanatoko compatibility build for Host 29.0.2. Soroban ledger.json file type and functionality."
homepage = "https://github.com/roman-karpovich/kanatoko"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/roman-karpovich/kanatoko"

[features]
testutils = ["soroban-env-host/testutils"]

[lib]
name = "soroban_ledger_snapshot"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.0"

[dependencies.serde_with]
version = "3.4.0"
features = ["hex"]

[dependencies.soroban-env-common]
version = "=29.0.2"
features = ["serde"]

[dependencies.soroban-env-host]
version = "=29.0.2"

[dependencies.thiserror]
version = "1.0"
